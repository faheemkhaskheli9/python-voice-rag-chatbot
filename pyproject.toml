[project]
name = "python-voice-rag-chatbot"
version = "0.1.0"
description = "Python Voice RAG Chatbot"
requires-python = ">=3.10"
dependencies = [
    "SpeechRecognition>=3.10,<4",
    "pyttsx3>=2.90,<3",
    "gTTS>=2.5,<3",
]

[project.optional-dependencies]
mic = ["PyAudio>=0.2.11"]
playback = ["playsound>=1.3,<2"]
dev = ["pytest>=7.4"]

[project.scripts]
voice-rag-chatbot = "voice_rag_chatbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
